# Lokalna MySQL baza za razvoj:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: connectly-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: connectly
      MYSQL_USER: connectly
      MYSQL_PASSWORD: connectly
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - connectly-mysql-data:/var/lib/mysql
volumes:
  connectly-mysql-data:
